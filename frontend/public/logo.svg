<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006948" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#004d34" />
    </linearGradient>

    <!-- Emerald Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- DNA Helix primary strand -->
    <linearGradient id="helixPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85f8c4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002114" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" filter="url(#softGlow)" />

  <!-- Decorative Inner Border -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="#85f8c4" stroke-opacity="0.25" stroke-width="2" />

  <!-- DNA Rungs / Horizontal Molecular Links -->
  <line x1="38" y1="38" x2="82" y2="38" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="44" y1="52" x2="76" y2="52" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="48" y1="64" x2="72" y2="64" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="44" y1="76" x2="76" y2="76" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="38" y1="90" x2="82" y2="90" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Left DNA Strand -->
  <path d="M34 26 C38 48, 82 56, 84 64 C86 72, 38 80, 36 102"
        fill="none"
        stroke="url(#helixPrimary)"
        stroke-width="7"
        stroke-linecap="round" />

  <!-- Right DNA Strand Intertwined -->
  <path d="M86 26 C82 48, 38 56, 36 64 C34 72, 82 80, 84 102"
        fill="none"
        stroke="#ffffff"
        stroke-width="6.5"
        stroke-linecap="round" />

  <!-- Sprouting Ecological Leaf on top right -->
  <path d="M60 28 C62 14, 82 12, 88 18 C88 28, 74 34, 60 28 Z"
        fill="url(#leafGrad)" />
  <path d="M62 26 C72 23, 80 20, 86 18"
        stroke="#006948"
        stroke-width="2"
        stroke-linecap="round"
        stroke-opacity="0.6" />

  <!-- Secondary delicate sprout leaf on top left -->
  <path d="M56 30 C50 18, 36 18, 32 24 C34 32, 46 34, 56 30 Z"
        fill="#34d399"
        fill-opacity="0.85" />
</svg>

