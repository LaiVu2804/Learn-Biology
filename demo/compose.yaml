version: '3.8'

services:
  # ---------------------------------------------
  # Dịch vụ Database MySQL 8.0
  # ---------------------------------------------
  mysqldb:
    image: mysql:8.0
    container_name: biology-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: biology
    ports:
      # Ánh xạ cổng: <Cổng máy tính của bạn>:<Cổng bên trong container>
      # Để 3307 để tránh trùng nếu máy tính bạn đã cài sẵn MySQL ở cổng 3306
      - "3307:3306"
    volumes:
      # Giữ lại dữ liệu database không bị mất khi tắt container
      - mysql_data:/var/lib/mysql
    networks:
      - jobhunter-network

  # ---------------------------------------------
  # Dịch vụ Redis
  # ---------------------------------------------
  redis:
    image: redis:6.2-alpine
    container_name: redis
    hostname: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB;FLUSHALL
    networks:
      - jobhunter-network

  # ---------------------------------------------
  # Dịch vụ Backend Spring Boot
  # ---------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biology-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Chú ý: trong mạng Docker, hostname kết nối tới database chính là tên service 'mysqldb'
      DB_URL: jdbc:mysql://mysqldb:3306/biology?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ha_Noi
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      UPLOAD_BASE_URI: file:///app/upload/
      # Biến môi trường kết nối tới dịch vụ Redis (dùng hostname là tên service 'redis')
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysqldb
      - redis
    networks:
      - jobhunter-network

# Khai báo volume lưu trữ dữ liệu MySQL bền vững
volumes:
  mysql_data:

# Khai báo mạng ảo để các container nói chuyện được với nhau
networks:
  jobhunter-network:
    driver: bridge
